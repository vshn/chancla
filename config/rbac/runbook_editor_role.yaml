# This rule is not used by the project chancla itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the chancla.vshn.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app.kubernetes.io/name: chancla
    app.kubernetes.io/managed-by: kustomize
  name: runbook-editor-role
rules:
- apiGroups:
  - chancla.vshn.io
  resources:
  - runbooks
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - chancla.vshn.io
  resources:
  - runbooks/status
  verbs:
  - get
